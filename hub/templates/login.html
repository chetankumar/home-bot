<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Home Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <link rel="stylesheet" href="/static/hub.css">
</head>
<body class="login-page">
  <form class="card login" method="post" action="/login">
    <h1>🏠 Home Hub</h1>
    {% if error %}<div class="flash tone-bad">{{ error }}</div>{% endif %}
    {% if not configured %}<div class="flash tone-warn">Set HUB_PASSWORD in .env and restart.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password <input type="password" name="password" autofocus autocomplete="current-password"></label>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
